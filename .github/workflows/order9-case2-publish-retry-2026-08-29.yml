name: Commit order-9 form-2 publication 2026-08-29
run-name: Order 9 · commit verified form-2 status

on:
  push:
    branches:
      - web/order9-case2-paused-2026-08-29
    paths:
      - .github/workflows/order9-case2-publish-retry-2026-08-29.yml

permissions:
  contents: write
  actions: read

env:
  RUN_DIR: Experiments/2026-08-29-order9-case2-paused
  VERIFIED_RUN_ID: "33267978483"

jobs:
  commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download already successful fourteen-leaf verification
        uses: actions/download-artifact@v4
        with:
          name: order9-case2-publication-verification
          path: verified-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.VERIFIED_RUN_ID }}

      - name: Apply deterministic status patch
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq \
            "PASS: order-9 three-Bad top form 2 is fully excluded in both engines." \
            verified-artifact/verifier-linux.log
          grep -Fq "bad3 summary: unsat=8/8; unknown=[]" verified-artifact/verifier-linux.log
          grep -Fq "bad3 summary: unsat=6/6; unknown=[]" verified-artifact/verifier-linux.log
          cp verified-artifact/verifier-linux.log "$RUN_DIR/verifier-linux.txt"
          python - <<'PY'
          from pathlib import Path
          path = Path("Experiments/2026-08-29-order9-case2-paused/apply_status_updates.py")
          text = path.read_text(encoding="utf-8")
          old = '    body = """That three-Bad pattern is now normalized exactly.  Select one strict extra\n'
          new = '    body = """  Select one strict extra\n'
          if text.count(old) != 1:
              raise SystemExit(f"self-patch marker count: {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m py_compile "$RUN_DIR/apply_status_updates.py"
          python "$RUN_DIR/apply_status_updates.py"
          rm -rf "$RUN_DIR/__pycache__"

      - name: Audit and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'so 16/24 forms are closed' README.md
          grep -Fq 'order-9 |Bad|=3 total top forms closed:                16/24 (66.7%).' docs/ACTIVE_FRONTIER_MIN.md
          grep -Fq 'форма 2 полностью закрыта' Experiments/START_HERE_WEB.md
          grep -Fq 'full:  33267614227' Experiments/START_HERE_WEB.md
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            docs/ACTIVE_FRONTIER_MIN.md \
            Experiments/START_HERE_WEB.md \
            Experiments/README.md \
            "$RUN_DIR/apply_status_updates.py" \
            "$RUN_DIR/verifier-linux.txt"
          git commit -m "Publish exact exclusion of order-9 three-Bad form 2"
          git push origin "HEAD:${GITHUB_REF_NAME}"
