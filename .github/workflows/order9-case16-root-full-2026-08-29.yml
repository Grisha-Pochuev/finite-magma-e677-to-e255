name: Order-9 form-16 root and Good-product split 2026-08-29
run-name: Order 9 · three-Bad form 16 · exact root refinement

on:
  push:
    branches:
      - web/order9-case16-root-2026-08-29
    paths:
      - .github/workflows/order9-case16-root-full-2026-08-29.yml

permissions:
  contents: read
  actions: read

env:
  RUN_DIR: Experiments/2026-08-29-order9-case16-root

jobs:
  scan:
    name: "${{ matrix.solver }} · ${{ matrix.mode }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - solver: cadical195
            mode: root-outcomes
            expected: "6"
            seconds: "60"
            conflicts: "500000"
          - solver: glucose42
            mode: root-outcomes
            expected: "6"
            seconds: "60"
            conflicts: "500000"
          - solver: cadical195
            mode: good-products
            expected: "2"
            seconds: "60"
            conflicts: "500000"
          - solver: glucose42
            mode: good-products
            expected: "2"
            seconds: "60"
            conflicts: "500000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements-e677-sat.txt

      - name: Install exact SAT dependency
        run: python -m pip install -r tools/requirements-e677-sat.txt

      - name: Static and source-integrity checks
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/e677_order9_no_hit_bad_count_sat.py \
            "$RUN_DIR/summarize_split.py" \
            "$RUN_DIR/collect.py"
          test "$(git hash-object tools/e677_order9_no_hit_bad_count_sat.py)" = \
            "efe356acd0047eef8ae5645b2cb04ac2a493632d"

      - name: Run exact refinement
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.mode }}" in
            root-outcomes)
              split_flag=(--bad3-canonical-root-outcomes)
              ;;
            good-products)
              split_flag=(--bad3-good-product-reps-only)
              ;;
            *)
              echo "unknown mode" >&2
              exit 64
              ;;
          esac

          mkdir -p output
          set +e
          python tools/e677_order9_no_hit_bad_count_sat.py \
            --min-bad 3 --max-bad 3 \
            --scan-bad3-structural \
            --bad3-frontier-only \
            --bad3-case 16 \
            "${split_flag[@]}" \
            --solver "${{ matrix.solver }}" \
            --per-count-seconds "${{ matrix.seconds }}" \
            --conflict-budget "${{ matrix.conflicts }}" \
            2>&1 | tee output/solver.log
          status=${PIPESTATUS[0]}
          set -e
          case "$status" in
            0|2|3) ;;
            *) echo "unexpected checker exit code: $status" >&2; exit "$status" ;;
          esac
          printf '%s\n' "$status" > output/checker-exit-code.txt
          python "$RUN_DIR/summarize_split.py" \
            --mode "${{ matrix.mode }}" \
            --solver "${{ matrix.solver }}" \
            --expected "${{ matrix.expected }}" \
            --log output/solver.log \
            --exit-code "$status" \
            --output output/summary.json

      - name: Upload exact record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "order9-case16-${{ matrix.mode }}-${{ matrix.solver }}"
          path: output/
          if-no-files-found: error
          retention-days: 30

  collect:
    name: Collect full summaries
    if: always()
    needs: scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: order9-case16-*
          path: downloaded
      - name: Build compact report
        run: |
          set -euo pipefail
          python "$RUN_DIR/collect.py" --input downloaded --output collected --expected 4
      - name: Upload collected full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order9-case16-summary
          path: collected/
          if-no-files-found: error
          retention-days: 30
