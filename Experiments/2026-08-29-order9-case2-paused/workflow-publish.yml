name: Publish order-9 form-2 closure 2026-08-29
run-name: Order 9 · publish form-2 closure and verify certificate

on:
  push:
    branches:
      - web/order9-case2-paused-2026-08-29
    paths:
      - .github/workflows/order9-case2-publish-2026-08-29.yml

permissions:
  contents: write
  actions: read

env:
  RUN_DIR: Experiments/2026-08-29-order9-case2-paused

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements-e677-sat.txt

      - name: Install exact SAT dependency
        run: python -m pip install -r tools/requirements-e677-sat.txt

      - name: Correct updater source and apply deterministic status patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("Experiments/2026-08-29-order9-case2-paused/apply_status_updates.py")
          text = path.read_text(encoding="utf-8")
          old = '    body = """That three-Bad pattern is now normalized exactly.  Select one strict extra\n'
          new = '    body = """  Select one strict extra\n'
          if text.count(old) != 1:
              raise SystemExit(f"self-patch marker count: {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m py_compile "$RUN_DIR/apply_status_updates.py"
          python "$RUN_DIR/apply_status_updates.py"

      - name: Reproduce all fourteen form-2 leaves
        shell: bash
        run: |
          set -euo pipefail
          python_exe="$(python -c 'import sys; print(sys.executable)')"
          pwsh -NoProfile -File ./verify_order9_three_bad_case2.ps1 \
            -PythonPath "$python_exe" 2>&1 | tee "$RUN_DIR/verifier-linux.log"
          grep -Fq \
            "PASS: order-9 three-Bad top form 2 is fully excluded in both engines." \
            "$RUN_DIR/verifier-linux.log"

      - name: Audit public status and diff
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'so 16/24 forms are closed' README.md
          grep -Fq 'order-9 |Bad|=3 total top forms closed:                16/24 (66.7%).' docs/ACTIVE_FRONTIER_MIN.md
          grep -Fq 'форма 2 полностью закрыта' Experiments/START_HERE_WEB.md
          grep -Fq 'full:  33267614227' Experiments/START_HERE_WEB.md
          git diff --check
          git status --short

      - name: Commit synchronized status files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            docs/ACTIVE_FRONTIER_MIN.md \
            Experiments/START_HERE_WEB.md \
            Experiments/README.md \
            "$RUN_DIR/apply_status_updates.py" \
            "$RUN_DIR/verifier-linux.log"
          git commit -m "Publish exact exclusion of order-9 three-Bad form 2"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload publication verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order9-case2-publication-verification
          path: |
            Experiments/2026-08-29-order9-case2-paused/verifier-linux.log
          if-no-files-found: warn
          retention-days: 30
