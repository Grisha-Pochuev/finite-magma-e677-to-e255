name: Publish order-9 form-3 closure 2026-08-29
run-name: Order 9 · verify and publish form-3 closure

on:
  push:
    branches:
      - web/order9-case3-root-2026-08-29
    paths:
      - .github/workflows/order9-case3-publish-2026-08-29.yml

permissions:
  contents: write
  actions: read

env:
  RUN_DIR: Experiments/2026-08-29-order9-case3-root

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements-e677-sat.txt

      - name: Install exact SAT dependency
        run: python -m pip install -r tools/requirements-e677-sat.txt

      - name: Apply deterministic status update
        run: |
          set -euo pipefail
          python -m py_compile "$RUN_DIR/apply_status_updates.py"
          python "$RUN_DIR/apply_status_updates.py"
          rm -rf "$RUN_DIR/__pycache__"

      - name: Reproduce form-3 certificate
        shell: bash
        run: |
          set -euo pipefail
          python_exe="$(python -c 'import sys; print(sys.executable)')"
          pwsh -NoProfile -File ./verify_order9_three_bad_case3.ps1 \
            -PythonPath "$python_exe" 2>&1 | tee "$RUN_DIR/verifier-linux.txt"
          grep -Fq \
            "PASS: order-9 three-Bad top form 3 is fully excluded in both engines." \
            "$RUN_DIR/verifier-linux.txt"
          test "$(grep -Fc 'bad3 summary: unsat=6/6; unknown=[]' "$RUN_DIR/verifier-linux.txt")" -eq 2
          test "$(grep -Fc 'bad3 summary: unsat=4/4; unknown=[]' "$RUN_DIR/verifier-linux.txt")" -eq 2

      - name: Audit public status and diff
        run: |
          set -euo pipefail
          grep -Fq 'so 17/24 forms are closed' README.md
          grep -Fq 'order-9 |Bad|=3 total top forms closed:                17/24 (70.8%).' docs/ACTIVE_FRONTIER_MIN.md
          grep -Fq 'форма 3 полностью закрыта' Experiments/START_HERE_WEB.md
          grep -Fq 'full:  33268434711' Experiments/START_HERE_WEB.md
          git diff --check

      - name: Commit synchronized status files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            docs/ACTIVE_FRONTIER_MIN.md \
            Experiments/START_HERE_WEB.md \
            Experiments/README.md \
            "$RUN_DIR/verifier-linux.txt"
          git commit -m "Publish exact exclusion of order-9 three-Bad form 3"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload publication verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order9-case3-publication-verification
          path: "$RUN_DIR/verifier-linux.txt"
          if-no-files-found: warn
          retention-days: 30
